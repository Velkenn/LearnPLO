  // One address only: a sign-in is remembered per address, so www would look signed out.
  if (location.hostname === 'www.feltready.com') location.replace('https://feltready.com' + location.pathname + location.search + location.hash);

  // from this page). Visitors land on the challenge.
  else if (location.pathname === '/share') history.replaceState(null, '', '/plo/?daily');
